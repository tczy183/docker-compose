              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "le": true
                },
                "indexByName": {
                  "cmd": 0,
                  "Value #A": 1,
                  "Value #B": 2,
                  "Value #C": 3
                },
                "renameByName": {
                  "cmd": "命令",
